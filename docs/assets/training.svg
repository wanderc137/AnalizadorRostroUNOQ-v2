<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" role="img" aria-labelledby="title desc">
  <title id="title">Entrenamiento UTKFace y exportación ONNX</title>
  <desc id="desc">Pipeline de entrenamiento: dataset UTKFace, parser de nombres, ocho buckets, split 80/10/10, augmentación, MobileNetV2 con dos cabezas, evaluación y exportación ONNX opset 13.</desc>
  <defs>
    <linearGradient id="bgt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#0e131b"/>
    </linearGradient>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#39d6ff"/>
    </marker>
  </defs>

  <rect width="1600" height="940" fill="url(#bgt)"/>
  <rect x="24" y="24" width="1552" height="892" rx="22" fill="none" stroke="#1c2632"/>

  <text x="60" y="76" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="700">Entrenamiento · UTKFace → ONNX</text>
  <text x="60" y="106" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="15">MobileNetV2 congelada + dos cabezas. El contrato de entrada se define una vez y lo respeta la app.</text>
  <rect x="1260" y="56" width="264" height="36" rx="18" fill="#101a2a" stroke="#2b4a6b"/>
  <text x="1280" y="79" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="12">run 41117352948 · 10 épocas</text>

  <!-- FLECHAS ENTRE FASES -->
  <line x1="398" y1="492" x2="424" y2="492" stroke="#39d6ff" stroke-width="2.5" marker-end="url(#at)"/>
  <line x1="776" y1="492" x2="802" y2="492" stroke="#39d6ff" stroke-width="2.5" marker-end="url(#at)"/>
  <line x1="1154" y1="492" x2="1180" y2="492" stroke="#39d6ff" stroke-width="2.5" marker-end="url(#at)"/>

  <!-- FASE 1 -->
  <text x="52" y="150" fill="#8b98a5" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">01 · DATOS</text>
  <rect x="48" y="164" width="350" height="620" rx="18" fill="#0f1620" stroke="#223041"/>

  <rect x="68" y="188" width="310" height="104" rx="12" fill="#0e1f2b" stroke="#1f5a78"/>
  <text x="86" y="216" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="600">UTKFace</text>
  <text x="86" y="240" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="12.5">23.708 rostros etiquetados</text>
  <text x="86" y="260" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="12.5">edad 0–116 · género 0=M / 1=F</text>
  <text x="86" y="280" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">jangedoo/utkface-new · uso académico</text>

  <line x1="223" y1="292" x2="223" y2="308" stroke="#39d6ff" stroke-width="2" marker-end="url(#at)"/>

  <rect x="68" y="312" width="310" height="132" rx="12" fill="#111d29" stroke="#2b4055"/>
  <text x="86" y="338" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="600">Parser tolerante</text>
  <text x="86" y="359" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="11.5">nombre: edad_género_raza_timestamp.jpg</text>
  <rect x="84" y="370" width="278" height="30" rx="5" fill="#0a0f15" stroke="#1e2a37"/>
  <text x="94" y="390" fill="#00ffb4" font-family="ui-monospace, Menlo, monospace" font-size="10.5">^(\d{1,3})_(\d)_\d+_(.+)$  +  self-test 9/9</text>
  <text x="86" y="420" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">limpia .chip / .jpg / .jpeg / .png…</text>
  <text x="86" y="437" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">descarta corruptos con OpenCV</text>

  <line x1="223" y1="444" x2="223" y2="460" stroke="#39d6ff" stroke-width="2" marker-end="url(#at)"/>

  <rect x="68" y="464" width="310" height="118" rx="12" fill="#141226" stroke="#423a72"/>
  <text x="86" y="490" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="600">8 buckets de edad</text>
  <text x="86" y="512" fill="#b9b3d6" font-family="ui-monospace, Menlo, monospace" font-size="10.5">0-2 · 3-9 · 10-19 · 20-29</text>
  <text x="86" y="530" fill="#b9b3d6" font-family="ui-monospace, Menlo, monospace" font-size="10.5">30-39 · 40-49 · 50-59 · 60+</text>
  <text x="86" y="556" fill="#5b6b7c" font-family="ui-sans-serif, sans-serif" font-size="11.5">La edad cruda se bucketiza antes del one-hot.</text>
  <text x="86" y="573" fill="#ffbe55" font-family="ui-monospace, Menlo, monospace" font-size="10">one-hot sobre edad cruda = bug</text>

  <line x1="223" y1="582" x2="223" y2="598" stroke="#39d6ff" stroke-width="2" marker-end="url(#at)"/>

  <rect x="68" y="602" width="310" height="160" rx="12" fill="#141a12" stroke="#3d5a2a"/>
  <text x="86" y="628" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="600">Split estratificado</text>
  <text x="86" y="654" fill="#00ffb4" font-family="ui-monospace, Menlo, monospace" font-size="13">80 % train</text>
  <text x="86" y="676" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="13">10 % validación</text>
  <text x="86" y="698" fill="#ffbe55" font-family="ui-monospace, Menlo, monospace" font-size="13">10 % test · 2.371 imágenes</text>
  <text x="86" y="724" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="11.5">scikit-learn · misma proporción de clases</text>
  <text x="86" y="744" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">semilla 42 → reproducible</text>

  <!-- FASE 2 -->
  <text x="430" y="150" fill="#8b98a5" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">02 · ENTRENAMIENTO</text>
  <rect x="426" y="164" width="350" height="620" rx="18" fill="#0f1620" stroke="#223041"/>

  <rect x="446" y="188" width="310" height="118" rx="12" fill="#111d29" stroke="#2b4055"/>
  <text x="464" y="214" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="600">Augmentación (solo train)</text>
  <text x="464" y="238" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="12">rotación ±20° · zoom 15 %</text>
  <text x="464" y="258" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="12">traslación 10 % · flip horizontal</text>
  <text x="464" y="278" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="12">brillo ±20 %</text>
  <text x="464" y="296" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">tf.data · nunca en validación/test</text>

  <line x1="601" y1="306" x2="601" y2="322" stroke="#39d6ff" stroke-width="2" marker-end="url(#at)"/>

  <rect x="446" y="326" width="310" height="128" rx="12" fill="#0e1f2b" stroke="#1f5a78"/>
  <text x="464" y="352" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="600">MobileNetV2 (ImageNet)</text>
  <text x="464" y="376" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="12">include_top=False · base congelada</text>
  <text x="464" y="396" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="12">entrada 224×224×3 (NHWC en Keras)</text>
  <text x="464" y="416" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="12">pooling global promedio</text>
  <text x="464" y="438" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">fine-tuning opcional: últimas 30 capas</text>

  <line x1="601" y1="454" x2="601" y2="470" stroke="#39d6ff" stroke-width="2" marker-end="url(#at)"/>

  <rect x="446" y="474" width="310" height="148" rx="12" fill="#1b1420" stroke="#6a2f52"/>
  <text x="464" y="500" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="600">Dos cabezas</text>
  <text x="464" y="524" fill="#ff9ec4" font-family="ui-monospace, Menlo, monospace" font-size="11">gender: Dense 128 → Dropout 0.5</text>
  <text x="464" y="542" fill="#ff9ec4" font-family="ui-monospace, Menlo, monospace" font-size="11">→ Dense 1 · sigmoid · BCE</text>
  <text x="464" y="566" fill="#ff9ec4" font-family="ui-monospace, Menlo, monospace" font-size="11">age: Dense 128 → Dropout 0.5</text>
  <text x="464" y="584" fill="#ff9ec4" font-family="ui-monospace, Menlo, monospace" font-size="11">→ Dense 8 · softmax · CCE</text>
  <text x="464" y="608" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">loss_weights: género 1.0 · edad 2.0</text>

  <line x1="601" y1="622" x2="601" y2="638" stroke="#39d6ff" stroke-width="2" marker-end="url(#at)"/>

  <rect x="446" y="642" width="310" height="120" rx="12" fill="#141a12" stroke="#3d5a2a"/>
  <text x="464" y="668" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="600">Optimización</text>
  <text x="464" y="692" fill="#c9d6c0" font-family="ui-sans-serif, sans-serif" font-size="12">Adam · lr 3e-4 en el run publicado</text>
  <text x="464" y="712" fill="#c9d6c0" font-family="ui-sans-serif, sans-serif" font-size="12">EarlyStopping · ReduceLROnPlateau</text>
  <text x="464" y="732" fill="#c9d6c0" font-family="ui-sans-serif, sans-serif" font-size="12">ModelCheckpoint .keras</text>
  <text x="464" y="752" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">10 épocas CPU · GitHub Actions ~37 min</text>

  <!-- FASE 3 -->
  <text x="808" y="150" fill="#8b98a5" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">03 · EVALUACIÓN</text>
  <rect x="804" y="164" width="350" height="620" rx="18" fill="#0f1620" stroke="#223041"/>

  <rect x="824" y="188" width="310" height="86" rx="12" fill="#0e1f2b" stroke="#1f5a78"/>
  <text x="842" y="214" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="600">Test independiente</text>
  <text x="842" y="238" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="12">2.371 imágenes no vistas en train</text>
  <text x="842" y="258" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">evaluation.json · classification_report</text>

  <rect x="824" y="292" width="310" height="86" rx="12" fill="#141a12" stroke="#3d5a2a"/>
  <text x="842" y="316" fill="#00ffb4" font-family="ui-sans-serif, sans-serif" font-size="12">GÉNERO · accuracy</text>
  <text x="842" y="352" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="34" font-weight="700">84,56 %</text>
  <text x="842" y="370" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">binario · test</text>

  <rect x="824" y="392" width="310" height="86" rx="12" fill="#101a2a" stroke="#2b4a6b"/>
  <text x="842" y="416" fill="#39d6ff" font-family="ui-sans-serif, sans-serif" font-size="12">EDAD · acierto exacto</text>
  <text x="842" y="452" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="34" font-weight="700">48,17 %</text>
  <text x="842" y="470" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">8 buckets · test</text>

  <rect x="824" y="492" width="310" height="86" rx="12" fill="#1a1410" stroke="#5a4020"/>
  <text x="842" y="516" fill="#ffbe55" font-family="ui-sans-serif, sans-serif" font-size="12">EDAD · ±1 bucket</text>
  <text x="842" y="552" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="34" font-weight="700">83,8 %</text>
  <text x="842" y="570" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">error de un bucket o menos</text>

  <rect x="824" y="592" width="310" height="170" rx="12" fill="#111d29" stroke="#2b4055"/>
  <text x="842" y="618" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="14" font-weight="600">Lectura honesta</text>
  <text x="842" y="642" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="11.5">· Un único entrenamiento, sin búsqueda</text>
  <text x="842" y="660" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="11.5">  de hiperparámetros ni ensemble.</text>
  <text x="842" y="680" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="11.5">· Métricas de test, no de uso real.</text>
  <text x="842" y="698" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="11.5">· El dataset hereda sesgos demográficos.</text>
  <text x="842" y="718" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="11.5">· No es edad exacta ni identidad.</text>
  <text x="842" y="742" fill="#ff6b6b" font-family="ui-monospace, Menlo, monospace" font-size="10.5">no usar para decisiones sobre personas</text>

  <!-- FASE 4 -->
  <text x="1186" y="150" fill="#8b98a5" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">04 · EXPORTACIÓN</text>
  <rect x="1182" y="164" width="350" height="620" rx="18" fill="#0f1620" stroke="#223041"/>

  <rect x="1202" y="188" width="310" height="150" rx="12" fill="#0e1f2b" stroke="#1f5a78"/>
  <text x="1220" y="214" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="600">Wrapper NCHW</text>
  <text x="1220" y="238" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="12">Keras trabaja en NHWC; el wrapper</text>
  <text x="1220" y="256" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="12">inserta Transpose dentro del grafo.</text>
  <rect x="1218" y="270" width="278" height="28" rx="5" fill="#0a0f15" stroke="#1e2a37"/>
  <text x="1228" y="289" fill="#00ffb4" font-family="ui-monospace, Menlo, monospace" font-size="10.5">input: [N, 3, 224, 224] float32</text>
  <text x="1220" y="320" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">salidas: gender [N,1] · age [N,8]</text>

  <line x1="1357" y1="338" x2="1357" y2="354" stroke="#39d6ff" stroke-width="2" marker-end="url(#at)"/>

  <rect x="1202" y="358" width="310" height="120" rx="12" fill="#141226" stroke="#423a72"/>
  <text x="1220" y="384" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="600">ONNX opset 13</text>
  <text x="1220" y="408" fill="#b9b3d6" font-family="ui-sans-serif, sans-serif" font-size="12">tf2onnx · float32</text>
  <text x="1220" y="430" fill="#b9b3d6" font-family="ui-sans-serif, sans-serif" font-size="12">validate_onnx_model: formas + dummy</text>
  <text x="1220" y="452" fill="#b9b3d6" font-family="ui-sans-serif, sans-serif" font-size="12">ensure_onnx_output_names</text>
  <text x="1220" y="470" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">opset 13 por compatibilidad con OpenCV DNN</text>

  <line x1="1357" y1="478" x2="1357" y2="494" stroke="#39d6ff" stroke-width="2" marker-end="url(#at)"/>

  <rect x="1202" y="498" width="310" height="128" rx="12" fill="#141a12" stroke="#3d5a2a"/>
  <text x="1220" y="524" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="600">Release v1.0.0</text>
  <text x="1220" y="548" fill="#c9d6c0" font-family="ui-monospace, Menlo, monospace" font-size="10.5">utkface_mobilenetv2.onnx</text>
  <text x="1220" y="568" fill="#c9d6c0" font-family="ui-monospace, Menlo, monospace" font-size="10.5">10.211.778 bytes</text>
  <text x="1220" y="588" fill="#c9d6c0" font-family="ui-monospace, Menlo, monospace" font-size="10.5">SHA256 390ade0e…c1661</text>
  <text x="1220" y="612" fill="#5b6b7c" font-family="ui-sans-serif, sans-serif" font-size="10.5">repositorio privado · requiere auth</text>

  <line x1="1357" y1="626" x2="1357" y2="642" stroke="#39d6ff" stroke-width="2" marker-end="url(#at)"/>

  <rect x="1202" y="646" width="310" height="116" rx="12" fill="#111d29" stroke="#2b4055"/>
  <text x="1220" y="672" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="600">Contrato con la app</text>
  <text x="1220" y="696" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="11.5">BGR → swapRB → RGB</text>
  <text x="1220" y="716" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="11.5">x/127.5 − 1 · blob NCHW 224</text>
  <text x="1220" y="736" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="11.5">age argmax → AGE_BUCKETS[i]</text>
  <text x="1220" y="754" fill="#ffbe55" font-family="ui-monospace, Menlo, monospace" font-size="10">si cambias el orden, cambia la app</text>

  <!-- FOOTER -->
  <rect x="48" y="812" width="1484" height="78" rx="14" fill="#0c1219" stroke="#1e2a37"/>
  <text x="72" y="840" fill="#8b98a5" font-family="ui-monospace, Menlo, monospace" font-size="11">REPRODUCIBILIDAD</text>
  <text x="72" y="864" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="12.5">Workflow train-utkface.yml (GitHub Actions) o CLI local · self-test del parser sin TensorFlow · validación ONNX con onnxruntime y cv2.dnn antes de publicar.</text>
  <text x="72" y="882" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">Cifras del run 41117352948; no son una garantía de precisión en otras poblaciones, cámaras o condiciones de luz.</text>
  <text x="1276" y="880" fill="#2f3d4d" font-family="ui-monospace, Menlo, monospace" font-size="10">docs/assets/training.svg</text>
</svg>
