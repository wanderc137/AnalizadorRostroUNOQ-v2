<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Topología de la red de demostración</title>
  <desc id="desc">Red aislada sin internet: notebook por cable, Arduino UNO Q y teléfono con IP Webcam por WiFi, router TP-Link TL-MR3420 con OpenWrt en 192.168.10.1.</desc>
  <defs>
    <linearGradient id="bgn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#0d131b"/>
    </linearGradient>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#39d6ff"/>
    </marker>
    <marker id="anw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffbe55"/>
    </marker>
    <marker id="ang" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00ffb4"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bgn)"/>
  <rect x="24" y="24" width="1552" height="852" rx="22" fill="none" stroke="#1c2632"/>

  <text x="60" y="76" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="700">Red de demo · aislada y portable</text>
  <text x="60" y="106" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="15">Todo el circuito funciona sin internet: router, placa, teléfono y notebook. La WAN del router no se conecta.</text>
  <rect x="1268" y="56" width="256" height="36" rx="18" fill="#1a1410" stroke="#5a4020"/>
  <text x="1288" y="79" fill="#ffbe55" font-family="ui-monospace, Menlo, monospace" font-size="12">LAN cerrada · sin WAN · sin nube</text>

  <!-- ROUTER CENTRAL -->
  <rect x="600" y="330" width="400" height="228" rx="18" fill="#0f1620" stroke="#2b4055"/>
  <rect x="600" y="330" width="400" height="52" rx="18" fill="#12202c"/>
  <circle cx="626" cy="356" r="6" fill="#00ffb4"/>
  <text x="644" y="363" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="700">Router · TP-Link TL-MR3420 v5</text>
  <text x="620" y="408" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="13">OpenWrt 24.10.8 · MT7628 · 2,4 GHz</text>
  <text x="620" y="432" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="13">LAN 192.168.10.1/24</text>
  <text x="620" y="454" fill="#9fb3c8" font-family="ui-monospace, Menlo, monospace" font-size="12">DHCP 192.168.10.100 – .249</text>
  <text x="620" y="476" fill="#9fb3c8" font-family="ui-monospace, Menlo, monospace" font-size="12">SSID DEMO-UNOQ · WPA2 · canal 1</text>
  <text x="620" y="498" fill="#9fb3c8" font-family="ui-monospace, Menlo, monospace" font-size="12">LuCI http://192.168.10.1</text>
  <text x="620" y="524" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">WAN sin conectar · sin salida a internet</text>

  <rect x="600" y="574" width="400" height="46" rx="10" fill="#141a12" stroke="#3d5a2a"/>
  <text x="620" y="603" fill="#00ffb4" font-family="ui-monospace, Menlo, monospace" font-size="11.5">tarda 2–3 min en levantar el AP tras encender</text>

  <!-- NOTEBOOK -->
  <rect x="64" y="360" width="390" height="210" rx="18" fill="#0f1620" stroke="#223041"/>
  <rect x="64" y="360" width="390" height="46" rx="18" fill="#12202c"/>
  <circle cx="88" cy="383" r="6" fill="#39d6ff"/>
  <text x="106" y="390" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="700">Notebook · navegador</text>
  <text x="84" y="434" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="13">Interfaz web y operación</text>
  <text x="84" y="458" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="12.5">http://192.168.10.75:8001</text>
  <text x="84" y="480" fill="#9fb3c8" font-family="ui-monospace, Menlo, monospace" font-size="12">http://analizador-v2.local:8001</text>
  <text x="84" y="502" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="11">mDNS · avahi</text>
  <text x="84" y="530" fill="#9fb3c8" font-family="ui-monospace, Menlo, monospace" font-size="11.5">perfil DEMO-UNOQ-CABLE · enp0s31f6</text>
  <text x="84" y="550" fill="#9fb3c8" font-family="ui-monospace, Menlo, monospace" font-size="11.5">DHCP .165 · prioridad 100 · IPv6 off</text>

  <!-- UNO Q -->
  <rect x="1146" y="330" width="400" height="240" rx="18" fill="#0f1620" stroke="#223041"/>
  <rect x="1146" y="330" width="400" height="46" rx="18" fill="#12202c"/>
  <circle cx="1170" cy="353" r="6" fill="#00ffb4"/>
  <text x="1188" y="360" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="700">Arduino UNO Q · MPU Linux</text>
  <text x="1166" y="404" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="13">QRB2210 · ARM64 · Debian</text>
  <text x="1166" y="428" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="13">192.168.10.75 · puerto 8001</text>
  <text x="1166" y="450" fill="#9fb3c8" font-family="ui-monospace, Menlo, monospace" font-size="12">perfil WiFi DEMO-UNOQ · IP fija</text>
  <text x="1166" y="472" fill="#9fb3c8" font-family="ui-monospace, Menlo, monospace" font-size="12">autoconnect prioridad 20</text>
  <text x="1166" y="494" fill="#9fb3c8" font-family="ui-monospace, Menlo, monospace" font-size="12">servicio unoq-app-v2 · enabled</text>
  <text x="1166" y="516" fill="#9fb3c8" font-family="ui-monospace, Menlo, monospace" font-size="12">SSH 22/2222 · usuario arduino</text>
  <text x="1166" y="540" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">hostname analizador-v2 · avahi</text>

  <!-- TELEFONO -->
  <rect x="600" y="680" width="400" height="168" rx="18" fill="#0f1620" stroke="#223041"/>
  <rect x="600" y="680" width="400" height="46" rx="18" fill="#12202c"/>
  <circle cx="624" cy="703" r="6" fill="#ffbe55"/>
  <text x="642" y="710" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="700">Teléfono · IP Webcam</text>
  <text x="620" y="752" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="13">Huawei Y9 Prime · cámara MJPEG</text>
  <text x="620" y="776" fill="#ffbe55" font-family="ui-monospace, Menlo, monospace" font-size="12.5">192.168.10.249 · puerto 8080</text>
  <text x="620" y="798" fill="#9fb3c8" font-family="ui-monospace, Menlo, monospace" font-size="12">http://192.168.10.249:8080/video</text>
  <text x="620" y="822" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">reserva DHCP por MAC · mantener en primer plano</text>

  <!-- ENLACES -->
  <!-- notebook - router cable -->
  <line x1="454" y1="465" x2="600" y2="465" stroke="#39d6ff" stroke-width="3"/>
  <rect x="484" y="440" width="86" height="22" rx="11" fill="#0b1118" stroke="#1e2a37"/>
  <text x="497" y="455" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="10">Ethernet</text>

  <!-- router - uno q wifi -->
  <line x1="1000" y1="440" x2="1146" y2="440" stroke="#00ffb4" stroke-width="2.5" stroke-dasharray="8 6"/>
  <rect x="1014" y="415" width="118" height="22" rx="11" fill="#0b1118" stroke="#1e2a37"/>
  <text x="1026" y="430" fill="#00ffb4" font-family="ui-monospace, Menlo, monospace" font-size="10">WiFi 2,4 GHz</text>

  <!-- router - telefono wifi -->
  <line x1="800" y1="558" x2="800" y2="680" stroke="#ffbe55" stroke-width="2.5" stroke-dasharray="8 6"/>
  <rect x="814" y="606" width="118" height="22" rx="11" fill="#0b1118" stroke="#1e2a37"/>
  <text x="826" y="621" fill="#ffbe55" font-family="ui-monospace, Menlo, monospace" font-size="10">WiFi 2,4 GHz</text>

  <!-- telefono -> uno q stream (ruta por router) -->
  <path d="M 1000 764 C 1080 764, 1080 600, 1146 560" fill="none" stroke="#5aa9ff" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#an)"/>
  <rect x="1010" y="690" width="128" height="38" rx="10" fill="#0b1118" stroke="#1e2a37"/>
  <text x="1022" y="705" fill="#5aa9ff" font-family="ui-monospace, Menlo, monospace" font-size="9.5">MJPEG 1080p</text>
  <text x="1022" y="719" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="9">→ 640×360 en la placa</text>

  <!-- flujo logico -->
  <rect x="1146" y="664" width="400" height="144" rx="16" fill="#0c1219" stroke="#1e2a37"/>
  <text x="1166" y="692" fill="#8b98a5" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.5">FLUJO DE UN FRAME</text>
  <text x="1166" y="716" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="12">1. IP Webcam publica MJPEG en .249:8080</text>
  <text x="1166" y="736" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="12">2. La UNO Q lo lee por WiFi y lo reduce</text>
  <text x="1166" y="756" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="12">3. YuNet + clasificador anotan el frame</text>
  <text x="1166" y="776" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="12">4. El navegador del notebook abre :8001/video</text>
  <text x="1166" y="796" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10">Ningún paquete sale de 192.168.10.0/24</text>

  <!-- footer / secuencia -->
  <rect x="48" y="122" width="1504" height="170" rx="16" fill="#0c1219" stroke="#1e2a37"/>
  <text x="70" y="150" fill="#8b98a5" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.5">ORDEN DE ENCENDIDO RECOMENDADO</text>

  <circle cx="84" cy="180" r="13" fill="#12202c" stroke="#2b4055"/>
  <text x="80" y="185" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="11">1</text>
  <text x="108" y="177" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600">Router 220 V</text>
  <text x="108" y="195" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="11.5">esperar 2–3 min</text>

  <circle cx="284" cy="180" r="13" fill="#12202c" stroke="#2b4055"/>
  <text x="280" y="185" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="11">2</text>
  <text x="308" y="177" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600">Cable LAN al notebook</text>
  <text x="308" y="195" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="11.5">DHCP .165</text>

  <circle cx="504" cy="180" r="13" fill="#12202c" stroke="#2b4055"/>
  <text x="500" y="185" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="11">3</text>
  <text x="528" y="177" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600">UNO Q</text>
  <text x="528" y="195" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="11.5">conecta a DEMO-UNOQ · .75</text>

  <circle cx="704" cy="180" r="13" fill="#12202c" stroke="#2b4055"/>
  <text x="700" y="185" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="11">4</text>
  <text x="728" y="177" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600">Teléfono a DEMO-UNOQ</text>
  <text x="728" y="195" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="11.5">reserva .249</text>

  <circle cx="924" cy="180" r="13" fill="#12202c" stroke="#2b4055"/>
  <text x="920" y="185" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="11">5</text>
  <text x="948" y="177" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600">IP Webcam</text>
  <text x="948" y="195" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="11.5">iniciar servidor :8080</text>

  <circle cx="1104" cy="180" r="13" fill="#12202c" stroke="#2b4055"/>
  <text x="1100" y="185" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="11">6</text>
  <text x="1128" y="177" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600">Abrir la UI</text>
  <text x="1128" y="195" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="11.5">.75:8001</text>

  <text x="70" y="240" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">El notebook conserva internet por su WiFi habitual: la ruta 192.168.10.0/24 sale por el cable. El teléfono debe quedarse en DEMO-UNOQ (desactivar conmutación automática).</text>
  <text x="70" y="262" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">Si la UNO Q arrancó antes que el router, puede quedarse en otra red: ejecutar nmcli connection up DEMO-UNOQ. La app reintenta la cámara cada 2 s sin reiniciar.</text>

  <text x="70" y="858" fill="#2f3d4d" font-family="ui-monospace, Menlo, monospace" font-size="10">docs/assets/network-demo.svg</text>
  <text x="1276" y="858" fill="#2f3d4d" font-family="ui-monospace, Menlo, monospace" font-size="10">basado en docs/demo-network.md</text>
</svg>
