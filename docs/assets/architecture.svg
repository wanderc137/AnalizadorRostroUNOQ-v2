<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura del AnalizadorRostroUNOQ v2</title>
  <desc id="desc">Flujo desde la cámara IP o USB hasta el navegador: captura, detección YuNet, tracker IoU, clasificación ONNX o Caffe, anotación, JPEG y stream MJPEG.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#0e141c"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffb4"/>
      <stop offset="1" stop-color="#39d6ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#39d6ff"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect x="24" y="24" width="1552" height="872" rx="22" fill="none" stroke="#1c2632"/>

  <text x="64" y="78" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="700">Arquitectura · AnalizadorRostroUNOQ v2</text>
  <text x="64" y="108" fill="#8b98a5" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15">Un productor, muchos consumidores: el pipeline anota una vez y sirve el mismo JPEG a todos los navegadores.</text>
  <rect x="1272" y="58" width="252" height="34" rx="17" fill="#0f2a22" stroke="#00ffb4" stroke-opacity="0.5"/>
  <text x="1294" y="80" fill="#00ffb4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">100 % local · sin nube · CPU</text>

  <!-- ZONA 1: FUENTES -->
  <text x="64" y="158" fill="#8b98a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">01 · FUENTE DE VÍDEO</text>
  <rect x="48" y="176" width="300" height="520" rx="18" fill="#0f1620" stroke="#223041"/>

  <rect x="70" y="204" width="256" height="150" rx="12" fill="#111d29" stroke="#2b4055"/>
  <text x="88" y="234" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="19" font-weight="600">Cámara IP / MJPEG</text>
  <text x="88" y="260" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="13.5">IP Webcam en un teléfono</text>
  <text x="88" y="282" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="13.5">DroidCam o cámara IP</text>
  <text x="88" y="316" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="12.5">http://IP:8080/video</text>
  <text x="88" y="338" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="11.5">CAP_FFMPEG · 1920×1080→640×360</text>

  <rect x="70" y="374" width="256" height="150" rx="12" fill="#111d29" stroke="#2b4055"/>
  <text x="88" y="404" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="19" font-weight="600">Logitech Brio USB</text>
  <text x="88" y="430" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="13.5">UVC / V4L2 · /dev/video0</text>
  <text x="88" y="452" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="13.5">Requiere host mode:</text>
  <text x="88" y="486" fill="#ffbe55" font-family="ui-monospace, Menlo, monospace" font-size="12.5">hub USB-C PD · o VIN + JCTL</text>
  <text x="88" y="508" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="11.5">CAP_V4L2 → CAP_ANY</text>

  <rect x="70" y="552" width="256" height="118" rx="12" fill="#0d1a17" stroke="#1f4d3f"/>
  <text x="88" y="580" fill="#00ffb4" font-family="ui-sans-serif, sans-serif" font-size="14" font-weight="600">Si no hay frames</text>
  <text x="88" y="604" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="13">placeholder 640×480 con aviso</text>
  <text x="88" y="626" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="13">"CAMARA NO DISPONIBLE"</text>
  <text x="88" y="650" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="11.5">reintento cada 2 s</text>

  <!-- flecha 1→2 -->
  <line x1="348" y1="430" x2="382" y2="430" stroke="#39d6ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="352" y="416" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="10">HTTP</text>

  <!-- ZONA 2: CAPTURA -->
  <text x="406" y="158" fill="#8b98a5" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">02 · CAPTURA</text>
  <rect x="390" y="176" width="300" height="520" rx="18" fill="#0f1620" stroke="#223041"/>

  <rect x="412" y="204" width="256" height="238" rx="12" fill="#111d29" stroke="#2b4055"/>
  <text x="430" y="234" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="19" font-weight="600">Camera thread</text>
  <text x="430" y="258" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="13">hilo daemon "camera-capture"</text>
  <line x1="430" y1="274" x2="650" y2="274" stroke="#223041"/>
  <text x="430" y="298" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="13.5">· abre VideoCapture</text>
  <text x="430" y="320" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="13.5">· fija W/H/FPS</text>
  <text x="430" y="342" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="13.5">· BUFFERSIZE = 1</text>
  <text x="430" y="364" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="13.5">· reduce conservando aspecto</text>
  <text x="430" y="386" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="13.5">· publica copia bajo lock</text>
  <text x="430" y="416" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="11.5">is_ok = frame &lt; 3 s</text>

  <rect x="412" y="460" width="256" height="106" rx="12" fill="#1a1410" stroke="#5a4020"/>
  <text x="430" y="488" fill="#ffbe55" font-family="ui-sans-serif, sans-serif" font-size="14" font-weight="600">Reconexión</text>
  <text x="430" y="512" fill="#d6c1a4" font-family="ui-sans-serif, sans-serif" font-size="13">20 lecturas fallidas →</text>
  <text x="430" y="534" fill="#d6c1a4" font-family="ui-sans-serif, sans-serif" font-size="13">release + espera 2 s + reopen</text>

  <rect x="412" y="584" width="256" height="86" rx="12" fill="#111d29" stroke="#2b4055"/>
  <text x="430" y="612" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="14" font-weight="600">FPS de captura</text>
  <text x="430" y="636" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="13">media exponencial (0.9 / 0.1)</text>
  <text x="430" y="658" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="11.5">no bloquea al pipeline</text>

  <!-- flecha 2→3 -->
  <line x1="658" y1="430" x2="694" y2="430" stroke="#39d6ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="662" y="416" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="10">frame</text>

  <!-- ZONA 3: ANALISIS -->
  <text x="718" y="158" fill="#8b98a5" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">03 · ANÁLISIS (1 WORKER)</text>
  <rect x="702" y="176" width="450" height="520" rx="18" fill="#0f1620" stroke="#223041"/>

  <rect x="724" y="204" width="406" height="106" rx="12" fill="#0e1f2b" stroke="#1f5a78"/>
  <text x="744" y="232" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="19" font-weight="600">Detección · YuNet</text>
  <text x="744" y="256" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="13">cada DETECT_EVERY_N frames (2)</text>
  <text x="744" y="278" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="11.5">entrada reducida 320 px · score 0.6 · NMS 0.3</text>
  <text x="744" y="298" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="11">fallback automático: Haar frontalface</text>

  <line x1="927" y1="312" x2="927" y2="330" stroke="#39d6ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="724" y="334" width="406" height="92" rx="12" fill="#141226" stroke="#423a72"/>
  <text x="744" y="362" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="19" font-weight="600">Tracker IoU</text>
  <text x="744" y="386" fill="#b9b3d6" font-family="ui-sans-serif, sans-serif" font-size="13">empareja cajas con IoU &gt; 0.3 · conserva la predicción</text>
  <text x="744" y="408" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="11.5">tolera TRACK_MAX_MISSES = 2 · evita parpadeo</text>

  <line x1="927" y1="428" x2="927" y2="446" stroke="#39d6ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="724" y="450" width="406" height="118" rx="12" fill="#1b1420" stroke="#6a2f52"/>
  <text x="744" y="478" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="19" font-weight="600">Clasificación · género + edad</text>
  <text x="744" y="502" fill="#d7c7d5" font-family="ui-sans-serif, sans-serif" font-size="13">cada INFER_EVERY_N frames (5), solo caras sin predicción</text>
  <text x="744" y="524" fill="#d7c7d5" font-family="ui-sans-serif, sans-serif" font-size="13">ONNX UTKFace 224×224 · fallback Caffe 227×227</text>
  <text x="744" y="548" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="11.5">8 buckets · confianza media visible como %</text>

  <line x1="927" y1="570" x2="927" y2="588" stroke="#39d6ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="724" y="592" width="406" height="78" rx="12" fill="#111d29" stroke="#2b4055"/>
  <text x="744" y="620" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="17" font-weight="600">Anotación + JPEG</text>
  <text x="744" y="644" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="13">cajas teal/ámbar · etiqueta · HUD · calidad 80</text>
  <text x="744" y="662" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="11">timings: detect · infer · encode · loop</text>

  <!-- flecha 3→4 -->
  <line x1="1158" y1="430" x2="1194" y2="430" stroke="#39d6ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1162" y="416" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="10">bytes</text>

  <!-- ZONA 4: SALIDA -->
  <text x="1218" y="158" fill="#8b98a5" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">04 · PUBLICACIÓN</text>
  <rect x="1204" y="176" width="348" height="520" rx="18" fill="#0f1620" stroke="#223041"/>

  <rect x="1226" y="204" width="304" height="104" rx="12" fill="#111d29" stroke="#2b4055"/>
  <text x="1246" y="232" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="19" font-weight="600">FastAPI + Uvicorn</text>
  <text x="1246" y="256" fill="#8b98a5" font-family="ui-sans-serif, sans-serif" font-size="13">un solo proceso · workers=1</text>
  <text x="1246" y="278" fill="#39d6ff" font-family="ui-monospace, Menlo, monospace" font-size="11.5">GET /video · /api/status · /api/config</text>
  <text x="1246" y="298" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="11.5">POST /api/camera/start|stop · /api/snapshot</text>

  <line x1="1378" y1="310" x2="1378" y2="328" stroke="#39d6ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1226" y="332" width="304" height="88" rx="12" fill="#0e1f2b" stroke="#1f5a78"/>
  <text x="1246" y="360" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="17" font-weight="600">Stream MJPEG</text>
  <text x="1246" y="382" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="12.5">multipart/x-mixed-replace</text>
  <text x="1246" y="402" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="11.5">yield solo si cambió el JPEG</text>

  <line x1="1378" y1="422" x2="1378" y2="440" stroke="#39d6ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1226" y="444" width="304" height="116" rx="12" fill="#141a12" stroke="#3d5a2a"/>
  <text x="1246" y="472" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="19" font-weight="600">Navegador</text>
  <text x="1246" y="496" fill="#c9d6c0" font-family="ui-sans-serif, sans-serif" font-size="13">index.html + app.js + style.css</text>
  <text x="1246" y="518" fill="#c9d6c0" font-family="ui-sans-serif, sans-serif" font-size="13">polling /api/status cada 1.2 s</text>
  <text x="1246" y="540" fill="#5b6b7c" font-family="ui-monospace, Menlo, monospace" font-size="11.5">anuncio contextual · token de sesión</text>

  <rect x="1226" y="578" width="304" height="94" rx="12" fill="#111d29" stroke="#2b4055"/>
  <text x="1246" y="606" fill="#e6edf3" font-family="ui-sans-serif, sans-serif" font-size="14" font-weight="600">Consumidores</text>
  <text x="1246" y="630" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="13">N clientes leen el mismo JPEG;</text>
  <text x="1246" y="652" fill="#9fb3c8" font-family="ui-sans-serif, sans-serif" font-size="13">la CPU no se multiplica.</text>

  <!-- barra inferior -->
  <rect x="48" y="728" width="1504" height="132" rx="18" fill="#0c1219" stroke="#1e2a37"/>
  <text x="72" y="760" fill="#8b98a5" font-family="ui-monospace, Menlo, monospace" font-size="11.5" letter-spacing="1.5">PRINCIPIOS DE DISEÑO</text>

  <circle cx="86" cy="790" r="5" fill="#00ffb4"/>
  <text x="102" y="795" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="13.5">Un único hilo produce frames; los clientes solo consumen.</text>

  <circle cx="86" cy="820" r="5" fill="#39d6ff"/>
  <text x="102" y="825" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="13.5">Sin clientes: modo idle (sin red, sin JPEG, sin detección).</text>

  <circle cx="86" cy="850" r="5" fill="#ffbe55"/>
  <text x="102" y="855" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="13.5">Sin modelo: modo degradado (solo detección, cajas ámbar).</text>

  <circle cx="818" cy="790" r="5" fill="#ff6b6b"/>
  <text x="834" y="795" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="13.5">Sin cámara: placeholder cada 1 s; el worker sigue vivo.</text>

  <circle cx="818" cy="820" r="5" fill="#b9b3d6"/>
  <text x="834" y="825" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="13.5">Todo el procesamiento ocurre en el MPU Linux de la UNO Q.</text>

  <circle cx="818" cy="850" r="5" fill="#5b6b7c"/>
  <text x="834" y="855" fill="#c9d6e2" font-family="ui-sans-serif, sans-serif" font-size="13.5">El MCU STM32U585 no participa en la inferencia.</text>

  <text x="1290" y="852" fill="#2f3d4d" font-family="ui-monospace, Menlo, monospace" font-size="10">docs/assets/architecture.svg</text>
</svg>
