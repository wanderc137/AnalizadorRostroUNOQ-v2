<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Playa tropical luminosa con mar turquesa, sombrillas de colores, palmeras y un velero">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="0.42" stop-color="#38bdf8"/>
      <stop offset="0.72" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffde7" stop-opacity="1"/>
      <stop offset="0.34" stop-color="#fde047" stop-opacity="0.62"/>
      <stop offset="0.7" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.3" stop-color="#06b6d4"/>
      <stop offset="0.68" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="beach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="0.35" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="palmLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="cloudBlur" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cielo diurno saturado -->
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- Sol alto y resplandor -->
  <circle cx="1250" cy="300" r="250" fill="url(#sunGlow)" opacity="0.92"/>
  <circle cx="1250" cy="300" r="92" fill="#fffde7" opacity="0.98"/>
  <circle cx="1250" cy="300" r="134" fill="#fde047" opacity="0.2" filter="url(#softGlow)"/>

  <!-- Nubes blancas -->
  <g fill="#ffffff" opacity="0.55" filter="url(#cloudBlur)">
    <ellipse cx="260" cy="180" rx="210" ry="30"/>
    <ellipse cx="470" cy="230" rx="140" ry="20"/>
    <ellipse cx="980" cy="150" rx="170" ry="22"/>
    <ellipse cx="1330" cy="250" rx="230" ry="26"/>
    <ellipse cx="760" cy="320" rx="130" ry="16"/>
  </g>

  <!-- Aves -->
  <g stroke="#0f766e" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M920 365 q16 -12 32 0 q16 -12 32 0"/>
    <path d="M1010 325 q12 -9 24 0 q12 -9 24 0"/>
    <path d="M1090 385 q10 -7 20 0 q10 -7 20 0"/>
  </g>

  <!-- Islas lejanas -->
  <path d="M0 640 L150 585 L290 625 L440 560 L590 640 L760 585 L930 650 L1110 590 L1280 650 L1440 595 L1600 640 L1600 720 L0 720 Z"
        fill="url(#island)" opacity="0.5"/>
  <path d="M0 680 L190 625 L360 665 L520 600 L700 675 L880 620 L1070 680 L1260 625 L1440 675 L1600 620 L1600 760 L0 760 Z"
        fill="#0f766e" opacity="0.42"/>

  <!-- Mar turquesa -->
  <rect x="0" y="640" width="1600" height="360" fill="url(#sea)"/>
  <path d="M1160 640 Q1220 640 1280 640 L1260 760 Q1235 805 1215 905 L1185 905 Q1195 795 1170 760 Z"
        fill="#fef08a" opacity="0.28"/>
  <g fill="#a5f3fc" opacity="0.55">
    <rect x="1138" y="654" width="132" height="3" rx="1.5"/>
    <rect x="1150" y="674" width="108" height="3" rx="1.5"/>
    <rect x="1162" y="696" width="88" height="4" rx="2"/>
    <rect x="1170" y="720" width="72" height="3" rx="1.5"/>
    <rect x="1178" y="746" width="58" height="4" rx="2"/>
    <rect x="1186" y="776" width="42" height="3" rx="1.5"/>
    <rect x="1192" y="808" width="30" height="3" rx="1.5"/>
  </g>
  <g stroke="#e0f2fe" stroke-linecap="round" opacity="0.38">
    <path d="M180 700 q35 -10 70 0" stroke-width="3"/>
    <path d="M350 745 q45 -12 90 0" stroke-width="2"/>
    <path d="M620 690 q40 -10 80 0" stroke-width="2"/>
    <path d="M760 780 q55 -12 110 0" stroke-width="2"/>
    <path d="M420 830 q60 -12 120 0" stroke-width="2"/>
    <path d="M980 720 q45 -10 90 0" stroke-width="2"/>
  </g>

  <!-- Velero -->
  <g transform="translate(860 660)" filter="url(#softShadow)">
    <path d="M0 46 L110 46 L90 66 L20 66 Z" fill="#0f172a"/>
    <path d="M52 44 L52 -42 L6 40 Z" fill="#ffffff"/>
    <path d="M56 42 L56 -28 L100 38 Z" fill="#fb7185"/>
    <path d="M52 44 L52 66" stroke="#0f172a" stroke-width="3"/>
  </g>

  <!-- Avión y estela -->
  <path d="M610 280 C800 246 980 226 1160 226" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.55" stroke-linecap="round"/>
  <g transform="translate(1160 226) rotate(-7)" filter="url(#softShadow)">
    <g fill="#f8fafc">
      <path d="M0 0 L86 9 L124 2 L92 21 L48 25 L22 16 L-8 21 L8 9 Z"/>
      <path d="M40 10 L20 -26 L34 -26 L64 8 Z"/>
      <path d="M40 15 L20 50 L34 50 L64 17 Z"/>
      <path d="M74 9 L88 -6 L96 -6 L86 11 Z"/>
    </g>
    <path d="M0 0 L86 9 L124 2 L92 21 L48 25 L22 16 L-8 21 L8 9 Z" fill="none" stroke="#0f172a" stroke-width="1.5" opacity="0.25"/>
    <path d="M74 9 L88 -6 L96 -6 L86 11 Z" fill="#fb7185"/>
  </g>

  <!-- Playa luminosa -->
  <path d="M0 860 C250 805 500 835 760 875 C1020 915 1300 905 1600 850 L1600 1000 L0 1000 Z" fill="url(#beach)"/>
  <path d="M0 870 C250 815 500 845 760 885 C1020 925 1300 915 1600 860" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.68"/>
  <path d="M0 900 C270 850 520 880 780 918 C1040 956 1310 942 1600 892" fill="none" stroke="#fff7e3" stroke-width="5" opacity="0.55"/>

  <!-- Toallas de playa -->
  <g transform="translate(1020 936) rotate(-7)">
    <rect x="-70" y="-20" width="140" height="40" rx="7" fill="#fb7185"/>
    <rect x="-70" y="-20" width="24" height="40" fill="#fef3c7" opacity="0.92"/>
    <rect x="-22" y="-20" width="14" height="40" fill="#fef3c7" opacity="0.92"/>
    <rect x="18" y="-20" width="24" height="40" fill="#fef3c7" opacity="0.92"/>
  </g>
  <g transform="translate(1210 950) rotate(6)">
    <rect x="-58" y="-16" width="116" height="32" rx="6" fill="#2dd4bf"/>
    <rect x="-58" y="-16" width="20" height="32" fill="#ffffff" opacity="0.85"/>
    <rect x="-14" y="-16" width="12" height="32" fill="#ffffff" opacity="0.85"/>
    <rect x="22" y="-16" width="18" height="32" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Sombrillas de colores -->
  <g transform="translate(960 862)">
    <ellipse cx="0" cy="80" rx="74" ry="13" fill="#0f172a" opacity="0.14"/>
    <rect x="-3" y="-6" width="6" height="90" rx="3" fill="#f8fafc"/>
    <path d="M-80 0 Q0 -84 80 0 Z" fill="#fb7185"/>
    <path d="M-80 0 Q-40 -42 0 0 Z" fill="#facc15"/>
    <path d="M0 0 Q40 -42 80 0 Z" fill="#2dd4bf"/>
    <path d="M-80 0 Q0 -84 80 0" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.65"/>
    <circle cx="0" cy="-84" r="4" fill="#f8fafc"/>
  </g>
  <g transform="translate(1130 878) scale(0.88)">
    <ellipse cx="0" cy="80" rx="74" ry="13" fill="#0f172a" opacity="0.14"/>
    <rect x="-3" y="-6" width="6" height="90" rx="3" fill="#f8fafc"/>
    <path d="M-80 0 Q0 -84 80 0 Z" fill="#facc15"/>
    <path d="M-80 0 Q-40 -42 0 0 Z" fill="#2dd4bf"/>
    <path d="M0 0 Q40 -42 80 0 Z" fill="#fb7185"/>
    <path d="M-80 0 Q0 -84 80 0" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.65"/>
    <circle cx="0" cy="-84" r="4" fill="#f8fafc"/>
  </g>
  <g transform="translate(1285 892) scale(0.76)">
    <ellipse cx="0" cy="80" rx="74" ry="13" fill="#0f172a" opacity="0.14"/>
    <rect x="-3" y="-6" width="6" height="90" rx="3" fill="#f8fafc"/>
    <path d="M-80 0 Q0 -84 80 0 Z" fill="#2dd4bf"/>
    <path d="M-80 0 Q-40 -42 0 0 Z" fill="#fb7185"/>
    <path d="M0 0 Q40 -42 80 0 Z" fill="#facc15"/>
    <path d="M-80 0 Q0 -84 80 0" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.65"/>
    <circle cx="0" cy="-84" r="4" fill="#f8fafc"/>
  </g>

  <!-- Pelota de playa -->
  <g transform="translate(870 946)">
    <circle r="24" fill="#facc15"/>
    <path d="M0 -24 A24 24 0 0 1 20 12 L0 0 Z" fill="#fb7185"/>
    <path d="M-20 12 A24 24 0 0 1 0 -24 L0 0 Z" fill="#2dd4bf"/>
    <circle r="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Palmeras verdes -->
  <g filter="url(#softShadow)">
    <path d="M1370 960 C1384 832 1400 700 1448 566 L1472 574 C1432 710 1422 838 1418 960 Z" fill="#a16207"/>
    <path d="M1370 960 C1384 832 1400 700 1448 566 L1458 570 C1420 704 1400 836 1400 960 Z" fill="#d97706" opacity="0.7"/>
    <g fill="url(#palmLeaf)">
      <path d="M1458 574 C1388 524 1318 536 1268 584 C1330 558 1402 566 1458 602 Z"/>
      <path d="M1458 570 C1424 500 1352 476 1296 504 C1360 504 1416 532 1458 594 Z"/>
      <path d="M1464 566 C1470 490 1530 438 1594 446 C1528 468 1490 510 1480 580 Z"/>
      <path d="M1464 574 C1520 522 1592 520 1636 558 C1568 546 1510 566 1470 604 Z"/>
      <path d="M1472 580 C1498 640 1560 676 1624 664 C1560 648 1518 618 1482 570 Z"/>
      <path d="M1448 566 C1428 646 1372 690 1310 686 C1368 664 1406 626 1438 560 Z"/>
    </g>
    <g fill="#166534">
      <circle cx="1458" cy="586" r="11"/>
      <circle cx="1444" cy="596" r="9"/>
      <circle cx="1470" cy="594" r="9"/>
    </g>
  </g>
  <g filter="url(#softShadow)" opacity="0.9">
    <path d="M1510 960 C1518 884 1530 810 1562 746 L1578 752 C1554 816 1548 886 1546 960 Z" fill="#a16207"/>
    <g fill="url(#palmLeaf)">
      <path d="M1562 748 C1516 720 1474 728 1444 758 C1484 740 1526 746 1562 768 Z"/>
      <path d="M1564 744 C1542 700 1498 684 1462 702 C1504 702 1538 720 1562 760 Z"/>
      <path d="M1568 742 C1576 692 1616 662 1654 668 C1612 682 1588 710 1580 754 Z"/>
      <path d="M1568 748 C1604 714 1650 714 1678 738 C1634 730 1596 744 1572 770 Z"/>
    </g>
  </g>

  <!-- Destellos de arena -->
  <g fill="#fff7ed" opacity="0.75">
    <circle cx="210" cy="930" r="2.5"/>
    <circle cx="330" cy="905" r="2"/>
    <circle cx="570" cy="945" r="2.5"/>
    <circle cx="780" cy="960" r="2"/>
    <circle cx="1080" cy="925" r="2.5"/>
    <circle cx="1260" cy="955" r="2"/>
  </g>

  <!-- Halo luminoso del horizonte -->
  <rect x="0" y="600" width="1600" height="70" fill="#ffffff" opacity="0.14"/>
</svg>
